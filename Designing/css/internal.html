  <!-- 
    internal : we apply internal css in <style> h1 { color: red;}  </style>  
    -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<!-- html comment -->
	<style>
		
		/* css comment -> grouping css*/
		
		h2,h3{color:red;background-color:pink;text-align:center}
		
		.myp1{color:yellow;background-color:blue}
		.uppercase{text-transform:uppercase}
		.centre{text-align:center}
		
		#myp2{color:orange;background-color:green}
		
		
		.box{
			height:200px;
			width:200px;
			background-color:red;
		}
		.box h1{
			color:white;
			text-align:center;
		}
		
		h4.mystyle{
			background-color:purple;
			text-align:center;
			text-decoration:underline;
		}
		
	</style>
	
</head>
<body>
	
    <h2>Hi i am inline css</h2>
	<h2>Hi i am inline css</h2>
	<h2>Hi i am inline css</h2>
	
	<h3>Hi i am inline css</h3>
   
	<p class="myp1">Hi i am paragraph</p>
	<p class="myp1 uppercase centre">Hi i am paragraph</p>
	<p class="myp1 centre">Hi i am paragraph</p>
	
	<p id="myp2">Hi i am paragraph</p>
	<p id="myp2">Hi i am paragraph</p>
	<p id="myp2">Hi i am paragraph</p>
	
	<div class="box">
		<h1>i m box h1</h1>
	</div>
	
	<h4 class="mystyle">i m box h1</h4>
	<h5 class="mystyle">i m box h1</h5>
	
</body>
</html>
