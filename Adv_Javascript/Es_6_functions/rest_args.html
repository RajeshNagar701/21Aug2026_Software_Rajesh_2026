<!DOCTYPE html>

<body>

<h2>JavaScript Function Rest Parameter</h2>
<p>
The rest parameter (...) allows a function to treat an indefinite number of
arguments as an array:</p>
<script>

// ... or arguments


function numbers()
{
	for(var i=0;i<arguments.length;i++)
	{
		document.write(arguments[i]+"<br>")
	}
}
numbers(1,2,3,4,5,6,10,12,15);



</script>

</body>
</html>
