

<table border='1' id="data">
	<tr>
		<th>ID</th>
		<th>User Id</th>
		<th>Title</th>
		<th>Body</th>
	</tr>
	
</table>


<script>

  
  
	fetch(`https://jsonplaceholder.typicode.com/posts`)
	.then((res)=>res.json())
	.then((myobj)=> {
		console.log(myobj)
		var div=document.getElementById('data');
		
		for(obj of myobj)
		{
			var html=`
			<tr>
				<td>${obj.id}</td>
				<td>${obj.userId}</td>
				<td>${obj.title}</td>
				<td>${obj.body}</td>
			</tr>
			`;
			div.insertAdjacentHTML('beforeend',html);
		}
	}) //);
	
	
</script>
