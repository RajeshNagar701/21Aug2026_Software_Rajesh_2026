OOPS

Object-oriented Programming treats data as a crucial element in program 
development and doesn't allow it to flow freely around the system.

It ties data more securely to the function that operates on it and protects it 
from accidental modification from an outside function. 

OOP breaks down a problem into several entities called objects and 
builds data and functions around these objects. 

Advantages Of object oriented over procedural programming:

OOP is faster and easier to execute
OOP provides a clear structure for the programs
OOP provide securities 
OOP code DRY "Don't Repeat Yourself", and makes the code easier to maintain, modify and debug
OOP makes it possible to create full reusable applications with less code and 
shorter development time
